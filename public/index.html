<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Instrument+Sans:wght@400;500;600;700&family=Silkscreen&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --night:#0B0A1F; --deep:#17123A; --violet:#33256C; --orchid:#7B4E9E; --rose:#D88BBE;
  --ink:#F4F1FF; --muted:#B9B0DC; --dim:#8F86B8;
  --glass:rgba(16,12,42,.42); --glass2:rgba(26,19,62,.58); --edge:rgba(255,255,255,.13); --edge2:rgba(255,255,255,.24);
  --lav:#C7B6FF; --lav-ink:#1B1240; --star:#FFE2A1; --mint:#9DE4C6; --warn:#FFB1A1;
  --display:"Pixelify Sans","Silkscreen",ui-monospace,system-ui,sans-serif;
  --body:"Instrument Sans","Avenir Next","Segoe UI",system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--night:#0B0A1F;--ink:#F4F1FF}}
:root[data-theme="dark"]{--night:#0B0A1F;--ink:#F4F1FF}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--night)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;background:#0B0A1F}
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(48vw 34vh at 85% 30%,rgba(216,139,190,.18),transparent 70%),
   radial-gradient(52vw 40vh at 10% 70%,rgba(123,78,158,.28),transparent 70%),
   radial-gradient(70vw 30vh at 50% 108%,rgba(255,200,230,.25),transparent 70%),
   linear-gradient(180deg,#0B0A1F 0%,#15113A 30%,#2A1E62 58%,#55388A 82%,#A86BA6 100%)}
.bgfx::before{content:"";position:absolute;inset:0;opacity:.75;
  background-image:
   radial-gradient(1.2px 1.2px at 12% 18%,#fff 60%,transparent),radial-gradient(1px 1px at 27% 62%,#fff 60%,transparent),
   radial-gradient(1.4px 1.4px at 44% 9%,#fff 60%,transparent),radial-gradient(1px 1px at 58% 41%,#fff 60%,transparent),
   radial-gradient(1.3px 1.3px at 71% 23%,#fff 60%,transparent),radial-gradient(1px 1px at 86% 57%,#fff 60%,transparent),
   radial-gradient(1px 1px at 93% 12%,#fff 60%,transparent),radial-gradient(1.2px 1.2px at 6% 79%,#fff 60%,transparent),
   radial-gradient(1px 1px at 35% 88%,#fff 60%,transparent),radial-gradient(1px 1px at 79% 84%,#fff 60%,transparent),
   radial-gradient(1px 1px at 18% 43%,rgba(255,255,255,.7) 60%,transparent),radial-gradient(1px 1px at 64% 71%,rgba(255,255,255,.7) 60%,transparent)}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--star);outline-offset:3px;border-radius:8px}
a{color:var(--lav)}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 20px 40px}

header.site{position:sticky;top:0;z-index:10;background:rgba(12,10,32,.94);border-bottom:1px solid var(--edge)}
.navin{max-width:1120px;margin:0 auto;padding:0 20px;height:68px;display:flex;align-items:center;gap:28px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:500;font-size:1.1rem;letter-spacing:.01em;color:var(--ink);text-decoration:none;flex-shrink:0}
.logo svg{width:30px;height:30px;flex-shrink:0}
nav.links{display:flex;gap:26px;margin-left:auto}
nav.links a{color:var(--muted);text-decoration:none;font-weight:500;padding:6px 0;border-bottom:2px solid transparent;white-space:nowrap}
nav.links a:hover{color:var(--ink)}
nav.links a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--star)}
nav.links a.mobonly{display:none}
nav.links .n{color:var(--dim);margin-left:5px;font-weight:500}
.authbox{display:flex;gap:10px;align-items:center;flex-shrink:0}
.authbox .btn{padding:8px 16px}
.acct{display:flex;align-items:center;gap:8px;border:1px solid var(--edge);background:transparent;border-radius:999px;padding:4px 12px 4px 4px;font-weight:600;font-size:.9rem;cursor:pointer;max-width:200px}
.acct:hover{border-color:var(--edge2)}
.av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--lav),var(--rose));color:var(--lav-ink);display:grid;place-items:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.acct .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu{display:none;border:1px solid var(--edge);background:transparent;border-radius:10px;width:40px;height:40px;cursor:pointer;place-items:center;margin-left:auto}
.menu svg{width:20px;height:20px}

footer.foot{position:relative;z-index:1;border-top:1px solid var(--edge);background:rgba(12,10,32,.7);margin-top:40px}
.footin{max-width:1120px;margin:0 auto;padding:36px 20px 44px;display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:28px}
.foot p{margin:10px 0 0;color:var(--muted);font-size:.9rem;max-width:42ch}
.foot h4{margin:0 0 10px;font-size:.9rem;font-weight:600;color:var(--ink)}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.foot a{color:var(--muted);text-decoration:none;font-size:.92rem}
.foot a:hover{color:var(--ink);text-decoration:underline}

h1,h2,h3{margin:0;font-weight:500}
h1,h2{font-family:var(--display);letter-spacing:-.01em}
h1{font-size:clamp(1.8rem,4.6vw,2.9rem);line-height:1.08}
h2{font-size:clamp(1.2rem,2.6vw,1.45rem);line-height:1.2}
h3{font-family:var(--body);font-size:1.08rem;font-weight:600;line-height:1.3}
.sub{color:var(--muted);margin:8px 0 0;max-width:62ch}
.why{font-size:.9rem;color:var(--muted);margin:0}
.desc{margin:8px 0 0;font-size:.95rem;color:#E6E1FA}
.pagehead{padding-top:40px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.rowhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:56px 0 16px}
.linkbtn{background:none;border:0;color:var(--lav);font-weight:600;cursor:pointer;padding:4px 0;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}

.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:40px;align-items:center;padding:44px 0 8px}
.skyside .intro{font-size:clamp(1.5rem,3.2vw,2.1rem);margin-top:6px}
.skyside .sub{font-size:1rem}
.skyside .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.skyside .cap{margin:4px 0 0;font-size:.9rem;color:var(--muted);text-align:center}
.post{background:rgba(18,14,46,.72);border:1px solid var(--edge);border-radius:16px;overflow:hidden}
.posthead{display:flex;align-items:center;gap:12px;padding:14px 18px}
.posthead .who{flex:1;min-width:0;font-size:.95rem;line-height:1.35}
.posthead .who span{color:var(--muted)}
.posthead .when{display:block;font-size:.82rem;color:var(--dim)}
.postimg{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:rgba(255,255,255,.04)}
.postimg.ph{aspect-ratio:5/2;display:grid;place-items:center;color:var(--lav);background:linear-gradient(135deg,rgba(199,182,255,.16),rgba(216,139,190,.14))}
.postimg.ph svg{width:54px;height:54px;opacity:.85}
.postbody{padding:16px 18px 20px}
.deadlines{margin:22px auto 0;max-width:360px;border-top:1px solid var(--edge);padding-top:16px}
.deadlines h3{font-size:.95rem}
.deadlines ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px}
.deadlines li{display:grid;grid-template-columns:58px 1fr;gap:10px;font-size:.92rem;align-items:baseline}
.deadlines li b{color:var(--star);font-weight:600}
.deadlines a{color:var(--ink);text-decoration:none}
.deadlines a:hover{text-decoration:underline}
.postbody h2{font-size:clamp(1.3rem,2.6vw,1.7rem)}
.postbody p{margin:8px 0 0;color:#E4DEFA;max-width:60ch}
.postbody .acts{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:14px}

.prose{max-width:68ch}
.prose p{color:#E6E1FA;font-size:1.04rem;line-height:1.7;margin:14px 0 0}
.prose h2{margin-top:44px}
.prose ul{color:#E6E1FA;line-height:1.7;padding-left:20px}

.authwrap{display:grid;place-items:center;padding:56px 0 20px}
.authcard{width:100%;max-width:420px;background:rgba(18,14,46,.82);border:1px solid var(--edge);border-radius:18px;padding:34px 30px 28px;text-align:center}
.authcard>svg{width:52px;height:52px}
.authcard h1{font-size:1.7rem;margin-top:14px}
.authcard .sub{margin:8px auto 0}
.authcard form{display:grid;gap:12px;margin-top:18px;text-align:left}
.authcard label{display:grid;gap:5px;font-weight:600;font-size:.9rem}
.authcard input{border:1px solid var(--edge);background:rgba(11,10,31,.55);border-radius:10px;padding:11px 12px;width:100%}
.authcard input:focus{outline:none;border-color:var(--lav)}
.authcard .btn{width:100%;padding:12px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:22px;border:1px solid var(--edge2);background:#fff;color:#1f1f1f;border-radius:12px;padding:11px;font-weight:600;cursor:pointer}
.gbtn svg{width:18px;height:18px}
.or{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:.85rem;margin:18px 0 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--edge)}
.authcard .foot2{margin:18px 0 0;font-size:.92rem;color:var(--muted)}
.sky{width:100%;height:auto;overflow:visible}
.sky line{stroke:rgba(255,226,161,.38);stroke-width:.9}
.sky circle.s{fill:var(--star)}
.sky circle.g{fill:rgba(255,226,161,.12)}
.sky text{fill:var(--muted);font-family:var(--body);font-size:11px;font-weight:500}
.sky .tw{animation:tw 4s ease-in-out infinite}
.sky .tw:nth-of-type(3n){animation-delay:1.3s}.sky .tw:nth-of-type(3n+1){animation-delay:2.6s}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.35}}

.card{background:var(--glass);border:1px solid var(--edge);border-radius:18px;padding:18px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.list{display:grid;gap:12px}
.pj{cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;width:100%;transition:border-color .15s,background-color .15s}
.pj:hover{border-color:var(--edge2);background:var(--glass2)}
.pjtop{display:flex;align-items:center;gap:10px}
.ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;background:linear-gradient(140deg,rgba(199,182,255,.28),rgba(216,139,190,.18));border:1px solid var(--edge)}
.ico svg{width:19px;height:19px}
.pjtop .gr{font-size:.85rem;color:var(--muted)}
.pjtop .sv{margin-left:auto;font-size:.8rem;font-weight:600;color:var(--star)}
.pj p{margin:0;font-size:.93rem;color:var(--muted)}
.credit{font-size:.84rem;color:var(--dim)}
.credit a{color:var(--muted)}
.chfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:12px;border-top:1px solid var(--edge);font-size:.84rem;color:var(--muted)}
.lvl{display:inline-flex;align-items:center;gap:7px}
.lvl .bars{display:inline-flex;gap:2px;align-items:flex-end}
.lvl .bars i{width:4px;border-radius:1px;background:rgba(255,255,255,.2)}
.lvl .bars i:nth-child(1){height:6px}.lvl .bars i:nth-child(2){height:9px}.lvl .bars i:nth-child(3){height:12px}.lvl .bars i:nth-child(4){height:15px}
.lvl .bars i.on{background:var(--star)}
.bar{height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint)}

.op .ophead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.op .org{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 18px;margin:14px 0 0;padding:12px 0 0;border-top:1px solid var(--edge)}
.facts dt{font-size:.8rem;color:var(--dim);font-weight:600}
.facts dd{margin:2px 0 0;font-size:.9rem}
.op a.go{display:inline-block;margin-top:12px;font-weight:600;font-size:.93rem}
.bm{flex-shrink:0;border:1px solid var(--edge);background:transparent;border-radius:999px;padding:5px 12px 5px 10px;font-size:.85rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.bm svg{width:14px;height:14px}
.bm:hover{border-color:var(--edge2);color:var(--ink)}
.bm[aria-pressed="true"]{color:var(--star);border-color:rgba(255,226,161,.5)}
.bm[aria-pressed="true"] svg{fill:currentColor}

.meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:500;padding:2px 10px;border-radius:999px;background:rgba(255,255,255,.08);color:#E4DEFA;line-height:1.7}
.tag.free{background:rgba(157,228,198,.14);color:var(--mint);font-weight:600}
.tag.match{background:rgba(255,226,161,.14);color:var(--star);font-weight:600}
.tag.due{background:rgba(255,177,161,.14);color:var(--warn);font-weight:600}
.tag.off{background:transparent;box-shadow:inset 0 0 0 1px var(--edge);color:var(--dim)}

.shelf{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 14px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.hl{flex:0 0 260px;scroll-snap-align:start;overflow:hidden;padding:0;display:flex;flex-direction:column}
.hl img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.hl .ph{aspect-ratio:4/3;background:rgba(255,255,255,.05);display:grid;place-items:center;color:var(--dim)}
.hl .ph svg{width:32px;height:32px}
.hl .b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.hl p{margin:0;font-size:.92rem;color:var(--muted)}
.hl .who{margin-top:auto;padding-top:8px;font-size:.84rem;color:var(--dim)}

.filters{margin:24px 0 20px;display:grid;gap:12px}
.search{display:flex;align-items:center;gap:10px;border:1px solid var(--edge);background:rgba(11,10,31,.45);border-radius:14px;padding:0 14px;max-width:560px}
.search:focus-within{border-color:var(--lav)}
.search svg{width:18px;height:18px;color:var(--dim);flex-shrink:0}
.search input{flex:1;border:0;background:transparent;padding:12px 0;outline:none;min-width:0}
.search input::placeholder{color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.toolbar .sep{width:1px;height:22px;background:var(--edge);margin:0 6px}
.toggle{border:1px solid var(--edge);background:transparent;border-radius:999px;padding:5px 13px;font-weight:500;cursor:pointer;font-size:.88rem;color:#E4DEFA}
.toggle:hover{border-color:var(--edge2)}
.toggle[aria-pressed="true"]{background:var(--ink);color:var(--lav-ink);border-color:var(--ink)}
.count{font-size:.88rem;color:var(--dim);margin:0 0 12px}

.btn{border:1px solid var(--lav);background:var(--lav);color:var(--lav-ink);font-weight:600;padding:10px 18px;border-radius:12px;cursor:pointer;transition:filter .15s;text-decoration:none;display:inline-block}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--glass);color:var(--ink);border-color:var(--edge)}
.btn.ghost:hover{border-color:var(--edge2);filter:none}
.btn.small{padding:6px 12px;font-size:.88rem;border-radius:9px}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}

.quiz{padding-top:36px;max-width:600px}
.qbrand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:500;margin-bottom:48px}
.qbrand svg{width:26px;height:26px}
.qstep{display:flex;justify-content:space-between;font-size:.88rem;color:var(--muted);margin-bottom:10px}
.dots{display:flex;gap:4px;margin-bottom:34px}
.dots i{height:3px;flex:1;border-radius:3px;background:rgba(255,255,255,.15)}
.dots i.on{background:var(--star)}
.options{display:grid;gap:8px;margin:26px 0}
.options.two{grid-template-columns:1fr 1fr}
.options.five{grid-template-columns:repeat(5,1fr)}
.options.five .opt{justify-content:center;text-align:center}
.options.five .opt::before{display:none}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--edge);background:var(--glass);border-radius:14px;padding:13px 14px;text-align:left;cursor:pointer;font-weight:600}
.opt::before{content:"";flex-shrink:0;width:16px;height:16px;margin-top:3px;border-radius:50%;border:1.5px solid var(--dim)}
.options.multi .opt::before{border-radius:4px}
.opt:hover{border-color:var(--edge2)}
.opt[aria-pressed="true"]{border-color:var(--star);background:rgba(255,226,161,.08)}
.opt[aria-pressed="true"]::before{border-color:var(--star);background:var(--star);box-shadow:inset 0 0 0 3px var(--deep)}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:.86rem;margin-top:1px}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 28px}
.textin{width:100%;border:1px solid var(--edge);background:var(--glass);border-radius:14px;padding:14px 16px;font-size:1.15rem;margin:26px 0 10px}
.textin:focus{outline:none;border-color:var(--lav)}
.qacts{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}

dialog{border:1px solid var(--edge2);border-radius:22px;padding:0;max-width:640px;width:calc(100% - 28px);color:var(--ink);
  background:linear-gradient(180deg,#1D1747,#141033);box-shadow:0 30px 80px rgba(0,0,0,.5)}
dialog[open]{animation:rise .22s ease-out}
dialog::backdrop{background:rgba(6,5,20,.6);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.dlg{padding:24px;max-height:86vh;overflow-y:auto}
.dlghead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:6px}
.dlghead h2{margin:0}
.close{flex-shrink:0;border:1px solid var(--edge);background:var(--glass);border-radius:50%;width:36px;height:36px;cursor:pointer;display:grid;place-items:center}
.close svg{width:14px;height:14px}
.dlg h3{margin-top:24px}
.dacts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.steps{list-style:none;padding:0;margin:10px 0 18px;display:grid;gap:6px;counter-reset:s}
.steps li{counter-increment:s}
.steps label{display:grid;grid-template-columns:22px 18px 1fr;gap:10px;align-items:start;cursor:pointer;padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.05)}
.steps label::before{content:counter(s);font-weight:700;color:var(--dim);text-align:right}
.steps input{margin:4px 0 0;width:17px;height:17px;accent-color:var(--mint)}
.steps .done span{text-decoration:line-through;color:var(--dim)}
.mats{padding-left:20px;margin:8px 0;color:#E4DEFA}
.mats li{margin:3px 0}
.note{margin:18px 0 0;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.05);font-size:.9rem;color:var(--muted)}
form.f{display:grid;gap:14px;margin-top:14px}
form.f label{display:grid;gap:5px;font-weight:600;font-size:.9rem}
form.f input:not([type=checkbox]),form.f select,form.f textarea{border:1px solid var(--edge);background:rgba(11,10,31,.5);border-radius:10px;padding:9px 11px;width:100%;font-weight:400}
form.f select option{background:#1D1747}
form.f input:focus,form.f select:focus,form.f textarea:focus{outline:none;border-color:var(--lav)}
form.f legend{font-weight:600;font-size:.9rem;margin-bottom:6px}
form.f fieldset{border:0;padding:0;margin:0}
form.f .inline{display:flex!important;gap:8px;align-items:center;font-weight:500!important}
form.f .hint{font-weight:400;color:var(--dim);font-size:.82rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:flex!important;align-items:center;gap:6px;font-weight:500!important;border:1px solid var(--edge);border-radius:999px;padding:4px 11px}
.rowitem{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--edge)}
.rowitem:first-child{padding-top:0}
.rowitem:last-child{border-bottom:0;padding-bottom:0}
.rowitem .acts{display:flex;gap:6px;flex-shrink:0}

function makeDb(){
  const {F,store}=FB;
  const wrap=s=>({id:s.id,exists:s.exists(),data:()=>s.data()});
  return {
    doc:p=>({
      get:async()=>wrap(await F.getDoc(F.doc(store,p))),
      set:o=>F.setDoc(F.doc(store,p),o),
      delete:()=>F.deleteDoc(F.doc(store,p))
    }),
    collection:n=>({
      onSnapshot:(cb,err)=>F.onSnapshot(F.collection(store,n),s=>cb({docs:s.docs.map(wrap)}),err),
      add:o=>F.addDoc(F.collection(store,n),o)
    }),
    batchSet:async items=>{
      for(let i=0;i<items.length;i+=400){
        const b=F.writeBatch(store);
        items.slice(i,i+400).forEach(([p,o])=>b.set(F.doc(store,p),o));
        await b.commit();
      }
    }
  };
}

function normalize(p){
  if(!p)return p;
  p.progress=p.progress||{};
  p.saved=p.saved||{p:[],o:[]};p.saved.p=p.saved.p||[];p.saved.o=p.saved.o||[];
  p.interests=(p.interests||[]).map(i=>i==='health'?'biology':i);
  if(typeof p.age==='string')p.age=null;
  p.langs=p.langs||[];p.hwTools=p.hwTools||[];
  return p;
}
async function init(){
  S.tab=routeFromHash();

    db=makeDb();

    FB.U.onAuthStateChanged(FB.auth,u=>onUser(u));
  }else{

async function onUser(u){
  fbUser=u;uid=u?u.uid:null;isAdmin=false;S.profile=null;Q=null;
  let remote=false;
  if(uid){
    try{isAdmin=(await db.doc('admins/'+uid).get()).exists}catch(e){}
    try{const s=await db.doc(profPath()).get();if(s.exists){S.profile=clone(s.data());remote=true}}catch(e){}
  }
  localOnly=!uid;
  if(!S.profile)S.profile=load('wb_profile',null);
  S.profile=normalize(S.profile);
  if(uid&&S.profile&&!remote)saveProfile();
  if(S.profile&&(S.profile.grade==null||S.profile.age==null)){Q=newQ();Q.step=STEPS.findIndex(s=>s.key==='grade')}
  if(uid&&!S.profile){Q=newQ();Q.name=((u.displayName||'').split(' ')[0])||''}
  if(unsubSubs){unsubSubs();unsubSubs=null;D.subs=[]}
  if(isAdmin){
    unsubSubs=db.collection('submissions').onSnapshot(s=>{
      D.subs=[];s.docs.forEach(d=>(d.data().items||[]).forEach(it=>D.subs.push({...it,owner:d.id})));refresh();
    },e=>console.warn('subs',e));
  }
  if(S.tab==='admin'&&!isAdmin)S.tab='home';
  render();
}
function subscribe(){
  const sub=(name,sort)=>db.collection(name).onSnapshot(s=>{D[name]=s.docs.map(d=>({id:d.id,...d.data()})).sort(sort);refresh()},e=>console.warn(name,e));
  sub('challenges',(a,b)=>(a.createdAt||0)-(b.createdAt||0));
  sub('opps',(a,b)=>(a.createdAt||0)-(b.createdAt||0));
  sub('highlights',(a,b)=>(b.createdAt||0)-(a.createdAt||0));
}
function refresh(){if(!Q&&!$('#dlg').open&&document.activeElement?.type!=='search'&&!['login','start'].includes(S.tab))render()}
async function saveProfile(){
  save('wb_profile',S.profile);
  if(localOnly)return;
  try{await queue(()=>db.doc(profPath()).set(clone(S.profile)))}
  catch(e){localOnly=true;toast('Saved on this device only')}
}

function fits(x){
  const p=P();if(p.grade==null)return true;
  if(x.minGrade!=null&&p.grade<x.minGrade)return false;
  if(x.maxGrade!=null&&p.grade>x.maxGrade)return false;
  if(x.minAge&&p.age<x.minAge)return false;
  return true;
}
const gradeText=x=>x.minGrade==null?'':x.minGrade===x.maxGrade?`Grade ${x.minGrade}`:`Grades ${x.minGrade}–${x.maxGrade??12}`;
const isPast=o=>o.date&&new Date(o.date+'T23:59')<today;
function scoreOpp(o){
  const p=P();
  const shared=(o.interests||[]).filter(i=>p.interests.includes(i));
  const ok=fits(o),near=o.where===p.hood,online=o.where==='Online';
  const s=shared.length*3+(near?2:online?1:0)+(o.cost===0?.5:0)-(ok?0:20);
  return {s,shared,ok,near,online};
}
function myLevel(c){const p=P();return c.track==='software'?p.sw:c.track==='hardware'?p.hw:Math.round((p.sw+p.hw)/2)}
function scoreCh(c){
  const p=P();const shared=(c.interests||[]).filter(i=>p.interests.includes(i));
  const mine=p.langs.concat(p.hwTools);const known=(c.tools||[]).filter(t=>mine.includes(t));
  const gap=(c.level||0)-myLevel(c);const ok=fits(c);
  const s=shared.length*3+(gap===0?2:gap===1?1:gap<0?(gap===-1?.5:-1):-2)+known.length*2-(ok?0:20);
  return {s,shared,known,ok};
}
function matches(x,q,ints){
  if(ints.length&&!(x.interests||[]).some(i=>ints.includes(i)))return false;
  if(!q.trim())return true;
  const hay=[x.title,x.blurb,x.org,x.type,x.where,x.when,(x.tools||[]).join(' '),(x.interests||[]).map(lbl).join(' '),x.credit?.name,TRACKS[x.track]].join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(t=>hay.includes(t));
}
const isSavedP=id=>P().saved.p.includes(id);

function toggleSave(kind,id,force){
  if(!S.profile){needAccount();return null}
  const arr=S.profile.saved[kind];const has=arr.includes(id);
  if(force===true&&has)return;
  S.profile.saved[kind]=has?arr.filter(x=>x!==id):[...arr,id];
  saveProfile();
  return !has;
}

function dueTag(o){
  if(!o.date)return '';const d=new Date(o.date+'T12:00');if(isNaN(d))return '';
  const days=Math.round((d-today)/864e5);
  if(days<0)return '<span class="tag off">Deadline passed</span>';
  const t=d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:d.getFullYear()!==today.getFullYear()?'numeric':undefined});
  return `<span class="tag ${days<=30?'due':''}">${days<=30?`Due in ${days} day${days===1?'':'s'}, ${t}`:'Due '+t}</span>`;
}
function costTag(o){return o.pays?'<span class="tag free">Paid</span>':o.cost===0?'<span class="tag free">Free</span>':typeof o.cost==='number'?`<span class="tag">$${esc(o.cost)}</span>`:o.costNote?`<span class="tag">${esc(o.costNote)}</span>`:''}

function hash(s){let h=7;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h}
function constellation(ids){
  const pts=(ids.length?ids:['space']).slice(0,10),n=pts.length,W=360,H=240;

  const MAP=[[88,138],[150,152],[172,90],[108,62],[230,112],[286,80],[322,128],[256,188],[50,84],[44,194]];
  const EDGES=[[0,1],[1,2],[2,3],[3,0],[2,4],[4,5],[5,6],[4,7],[3,8],[0,9]];
  const use=MAP.slice(0,n);
  const xs=use.map(p=>p[0]),ys=use.map(p=>p[1]);
  const dx=W/2-(Math.min(...xs)+Math.max(...xs))/2,dy=H/2-(Math.min(...ys)+Math.max(...ys))/2;
  const P=use.map(([x,y],i)=>({id:pts[i],x:x+dx,y:y+dy,r:2.1+(hash(pts[i])%5)*.35}));
  const cx=P.reduce((a,p)=>a+p.x,0)/n,cy=P.reduce((a,p)=>a+p.y,0)/n;
  const lines=EDGES.filter(([a,b])=>a<n&&b<n).map(([a,b])=>`<line x1="${P[a].x}" y1="${P[a].y}" x2="${P[b].x}" y2="${P[b].y}"/>`).join('');
  const stars=P.map(p=>{const it=INTERESTS.find(x=>x.id===p.id);const right=n===1||p.x>=cx;const above=p.y<cy;
    return `<circle class="g" data-star="${P.indexOf(p)}" cx="${p.x}" cy="${p.y}" r="${p.r*3.2}"/><circle class="s tw" data-star="${P.indexOf(p)}" cx="${p.x}" cy="${p.y}" r="${p.r}"/><text x="${p.x+(right?10:-10)}" y="${p.y+(above?-8:14)}" text-anchor="${right?'start':'end'}">${esc(it?it.s:p.id)}</text>`}).join('');
  const dust=[...Array(26)].map((_,i)=>{const h=hash('d'+i+ids.join());return `<circle cx="${h%W}" cy="${(h>>9)%H}" r="${((h>>4)%3)*.3+.4}" fill="#fff" opacity="${.15+((h>>6)%4)*.08}"/>`}).join('');
  return `<svg class="sky" viewBox="0 0 ${W} ${H}" role="img" aria-label="Interests: ${esc(ids.map(lbl).join(', '))}">${dust}${lines}${stars}</svg>`;
}

function upNext(){
  const p=S.profile;
  const last=p&&p.last?D.challenges.find(c=>c.id===p.last):null;
  if(last&&prog(last)<1){
    const steps=last.steps||[],pr=p.progress[last.id]||[],n=steps.findIndex((_,k)=>!pr[k]),pct=Math.round(prog(last)*100);
    return `<div class="upnext"><span class="lab">Pick up where you left off</span><h3>${esc(last.title)}</h3>
      <p>Step ${n+1} of ${steps.length}: ${esc(steps[n]||'')}</p><div class="bar" role="img" aria-label="${pct} percent done"><i style="width:${pct}%"></i></div>
      <button class="linkbtn" data-ch="${esc(last.id)}">Continue</button></div>`;
  }
  const pool=D.challenges.filter(c=>fits(c)&&prog(c)<1);
  const pick=p?pool.map(c=>({c,s:scoreCh(c).s})).sort((a,b)=>b.s-a.s)[0]?.c:(pool.find(c=>(c.level||0)===0)||pool[0]);
  if(!pick)return '';
  return `<div class="upnext"><span class="lab">${p?'Suggested for you':'Try this first'}</span><h3>${esc(pick.title)}</h3>
    <p>${esc(pick.blurb)}</p><p>${esc(gradeText(pick))}, ${esc((pick.time||'').toLowerCase())}${pick.credit?.name?`, from ${esc(pick.credit.name)}`:''}.</p>
    <button class="linkbtn" data-ch="${esc(pick.id)}">Open project</button></div>`;
}

function vAbout(){
  return `<section class="pagehead"><div>${pageTitle('About Workbench')}</div></section>
  <div class="prose">
    <p>When I was a kid, the library near my house ran free weekend workshops. One week we built paper circuits, the next we made catapults out of popsicle sticks. That's where I first figured out I liked building things.</p>
    <p>Years later, I wanted to tell a younger kid about those workshops. When I looked them up, I found out they had ended years ago. The funding ran out, and nothing replaced them.</p>
    <p>Free programs like that are hard to find, and so is a community of people who like the same things you do. Even when opportunities exist, they're usually not built around a student's skill level. And the students who end up in the big summer programs and internships rarely come from our area.</p>
    <p>That's why we built Workbench. It matches students to free projects and programs based on their grade, their interests, and what they already know, so anyone can find a place to start.</p>
    <h2>How it works</h2>
    <ul><li>Answer a few questions about your grade, your experience, and what you're into.</li><li>Get projects you can start today, with step by step instructions.</li><li>Find summer programs, internships, competitions, and clubs you can actually apply to, with deadlines.</li><li>Finish a project and share it with the community.</li></ul>
    <h2>Credits</h2>
    <p>Project guides are adapted from Hack Club, NASA, Science Buddies, the Raspberry Pi Foundation, Code.org, Scratch, and others. Each project page names and links its original source. Program details come from each program's official site, and dates change every year, so always check there before applying.</p>
  </div>`;
}

const AUTH_ERR={'auth/invalid-credential':'That email and password don\'t match. Try again or reset your password.','auth/wrong-password':'That email and password don\'t match.','auth/user-not-found':'There is no account with that email. Create one instead.','auth/email-already-in-use':'There is already an account with that email. Log in instead.','auth/weak-password':'Use a password with at least 6 characters.','auth/invalid-email':'That email address doesn\'t look right.','auth/too-many-requests':'Too many tries. Wait a minute and try again.','auth/operation-not-allowed':'Email sign-in isn\'t turned on yet. Use Google, or turn on Email/Password in Firebase.'};
function bindAuth(login){
  const g=$('#gbtn');if(g)g.onclick=signIn;
  const gu=$('#guest');if(gu)gu.onclick=()=>{Q=newQ();render()};
  const fg=$('#forgot');if(fg)fg.onclick=async()=>{const em=$('#af [name=email]').value.trim();if(!em)return $('#aer').textContent='Type your email above first, then press Forgot password.';
    try{await FB.U.sendPasswordResetEmail(FB.auth,em);toast('Check your email for a reset link')}catch(e){$('#aer').textContent=AUTH_ERR[e.code]||'That did not work. Check the email and try again.'}};
  const f=$('#af');if(f)f.onsubmit=async e=>{e.preventDefault();const em=f.email.value.trim(),pw=f.pw.value;
    if(!em||!pw)return $('#aer').textContent='Enter your email and a password.';
    try{await (login?FB.U.signInWithEmailAndPassword:FB.U.createUserWithEmailAndPassword)(FB.auth,em,pw)}

}

async function shrink(file){
  const url=URL.createObjectURL(file);
  try{
    const im=await new Promise((ok,bad)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>bad({msg:'That file is not an image this browser can read. Try a JPG or PNG.'});i.src=url});
    let w=im.naturalWidth,h=im.naturalHeight;const max=1000;if(w>max||h>max){const k=max/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
    let q=.8,out=c.toDataURL('image/jpeg',q);while(out.length>700000&&q>.4){q-=.1;out=c.toDataURL('image/jpeg',q)}
    if(out.length>900000)throw {msg:'That photo is too detailed to store. Try a smaller one.'};
    return out;
  }finally{URL.revokeObjectURL(url)}
}
